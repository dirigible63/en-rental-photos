<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EN Rental Photos</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#172635;font:16px system-ui,sans-serif}header{background:#203040;color:white;padding:22px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0}main{max-width:620px;margin:auto;padding:18px}form{background:white;border-radius:12px;padding:20px}label{display:block;font-weight:650;margin:16px 0 6px}input,button{font:inherit}input:not([type=file]){width:100%;padding:13px;border:1px solid #aab4be;border-radius:6px;font-size:18px}button,.pick{display:block;width:100%;padding:14px;border:0;border-radius:7px;background:#203040;color:white;font-weight:650;text-align:center;cursor:pointer}button:disabled{opacity:.5} .pick{background:#e6edf4;color:#203040;border:1px dashed #73889c}#files{position:absolute;width:1px;height:1px;opacity:0}#files:focus+.pick{outline:3px solid #4779aa}small{color:#526170}#photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:15px 0}.photo{border:1px solid #ddd;padding:8px;border-radius:6px;overflow-wrap:anywhere}.photo img{width:100%;height:100px;object-fit:cover}.photo button{background:#e9edf1;color:#203040;padding:7px;margin-top:6px}#path{overflow-wrap:anywhere;background:#f1f4f6;padding:10px;border-radius:6px}progress{width:100%}#status{white-space:pre-wrap;overflow-wrap:anywhere}.notice{background:#fff4d8;padding:12px;border-radius:7px;margin-bottom:15px}footer{text-align:center;color:#526170;padding:16px;font-size:13px}a{color:#244e79}</style></head><body><header><h1>EQUIPMENT NORTH</h1><p>Rental Equipment Photos</p></header><main><div class="notice"><strong>Build 1.0 · Test mode</strong><br>No photos are sent to cloud storage. Use the test upload to check compression.</div><form id="form"><label for="date">Date</label><input id="date" type="date" required><label for="contract">Contract #</label><input id="contract" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required><label for="unit">Unit #</label><input id="unit" maxlength="40" pattern="[A-Za-z0-9_\-]+" placeholder="EX-1042" required><label>Photographs</label><input id="files" type="file" accept="image/*,.heic,.heif" multiple><label class="pick" for="files">Select photos from gallery</label><small>Up to 30 photos. Select again to add more.</small><div id="photos"></div><p id="summary"></p><small>Proposed storage destination</small><p id="path"></p><button id="upload" type="submit">Test upload</button><progress id="progress" value="0" max="1" hidden></progress><p id="status" role="status" aria-live="polite"></p><div id="results"></div><button id="next" type="button" hidden>Next unit</button></form></main><footer>EN Rental Photos · Build 1.0</footer><script src="app.js"></script></body></html>
